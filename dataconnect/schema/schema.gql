type User @table {
  username: String!
  email: String!
  passwordHash: String!
  createdAt: Timestamp!
  displayName: String
  bio: String
  profilePictureUrl: String
}

type Post @table {
  title: String!
  content: String!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  imageUrl: String
  isPublished: Boolean
  author: User
}

type Tag @table {
  name: String!
}

type PostTag @table(key: ["post", "tag"]) {
  post: Post!
  tag: Tag!
}

type Comment @table {
  content: String!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  author: User
  post: Post
}

type Follow @table(key: ["follower", "followee"]) {
  follower: User!
  followee: User!
  createdAt: Timestamp!
}

type FavoritePost @table(key: ["user", "post"]) {
  user: User!
  post: Post!
  createdAt: Timestamp!
}